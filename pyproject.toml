[project]
name = "fitfetch"
version = "1.4.5"
description = "Extract FuckingFast direct download links from FitGirl Repacks in seconds."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cloudscraper>=1.2.71",
    "httpx>=0.28.1",
    "pyqt6>=6.11.0",
    "setuptools>=82.0.1",
    "zendriver>=0.15.5",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]

